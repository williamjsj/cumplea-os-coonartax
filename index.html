<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COCOLAB COONARTAX 2026</title>
    <style>
        :root {
            --primary: #1e40af; /* Workshop Blue 2026 */
            --accent: #10b981; /* Soft Teal */
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* Mejora Interfaz: Header Estilo Lab */
        .lab-header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .lab-tag {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.25rem 1rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem; }

        .search-container {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
        }

        input, select {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            outline: none;
        }

        /* Grid de Cumpleaños */
        .birthday-grid {
            display: grid;
            gap: 1rem;
        }

        .birthday-card {
            background: white;
            padding: 1.25rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 5px solid var(--accent);
        }

        .birthday-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .info { display: flex; align-items: center; gap: 1rem; }
        .avatar {
            width: 45px; height: 45px;
            background: #dbeafe;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .date-tag {
            background: #f3f4f6;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--primary);
        }

        .highlight { border-color: #f59e0b; background: #fffbeb; }

        footer { text-align: center; margin-top: 4rem; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <header class="lab-header">
        <span class="lab-tag">COCOLAB</span>
        <h1>COONARTAX 2026</h1>
        <p>Panel de Celebraciones Corporativas</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar empleado...">
        <select id="monthFilter">
            <option value="">Todos los meses</option>
            <option value="01">Enero</option>
            <option value="02">Febrero</option>
            <option value="03">Marzo</option>
            <option value="04">Abril</option>
            <option value="05">Mayo</option>
            <option value="06">Junio</option>
            <option value="07">Julio</option>
            <option value="08">Agosto</option>
            <option value="09">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
        </select>
    </div>

    <div id="birthdayList" class="birthday-grid"></div>

    <footer>
        <p>&copy; 2026 COCOLAB COONARTAX | Gestión de Talento Humano</p>
    </footer>
</div>

<script>
    const birthdays = [
        { name: "Ramiro Herrera", date: "2025-01-27" },
        { name: "Diego Mora", date: "2025-01-30" },
        { name: "Amanda Villarreal", date: "2025-01-31" },
        { name: "Don Bayardo Eraso", date: "2025-02-09" },
        { name: "Diana Quintero", date: "2025-02-21" },
        { name: "Ayde Ipaz", date: "2025-03-03" },
        { name: "Yamit Linares", date: "2025-03-06" },
        { name: "Jaime Bastidas", date: "2025-03-14" },
        { name: "Wilson Mora", date: "2025-03-22" },
        { name: "Milena Gonzalez", date: "2025-03-26" },
        { name: "Fernando Chamorro", date: "2025-04-10" },
        { name: "Alejandra Florez", date: "2025-04-15" },
        { name: "Elizabeth Rosero", date: "2025-05-07" },
        { name: "Don Wilson Diaz", date: "2025-05-12" },
        { name: "Darcy Valentina", date: "2025-06-17" },
        { name: "Don Jorge Meza", date: "2025-07-03" },
        { name: "Don Victor Orejuela", date: "2025-07-25" },
        { name: "Andrea Cabrera", date: "2025-08-04" },
        { name: "Leydi Bastidas", date: "2025-08-23" },
        { name: "Dra. Alexandra", date: "2025-08-24" },
        { name: "Alemao Rosero", date: "2025-08-25" },
        { name: "Fabian Villota", date: "2025-08-25" },
        { name: "Adali Delgado", date: "2025-09-10" },
        { name: "Andres Salazar", date: "2025-09-28" },
        { name: "Carlos Figueroa", date: "2025-10-06" },
        { name: "Ximena Meneses", date: "2025-10-21" },
        { name: "William Salazar", date: "2025-12-01" },
        { name: "Doris Rosero", date: "2025-12-02" },
        { name: "Don Ramiro Meza", date: "2025-12-25" }
    ];

    function render() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const monthTerm = document.getElementById('monthFilter').value;
        const list = document.getElementById('birthdayList');
        const now = new Date();
        const currentMonth = String(now.getMonth() + 1).padStart(2, '0');

        list.innerHTML = birthdays
            .filter(b => {
                const bMonth = b.date.split('-')[1];
                return b.name.toLowerCase().includes(searchTerm) && 
                       (monthTerm === "" || bMonth === monthTerm);
            })
            .map(b => {
                const [y, m, d] = b.date.split('-');
                const isThisMonth = m === currentMonth;
                return `
                    <div class="birthday-card ${isThisMonth ? 'highlight' : ''}">
                        <div class="info">
                            <div class="avatar">${b.name[0]}</div>
                            <div>
                                <strong>${b.name}</strong>
                                <div style="font-size: 0.8rem; color: #6b7280">${isThisMonth ? '¡Cumple este mes! 🎂' : ''}</div>
                            </div>
                        </div>
                        <div class="date-tag">${d} / ${m}</div>
                    </div>
                `;
            }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('monthFilter').addEventListener('change', render);
    render();
</script>

</body>
</html>
