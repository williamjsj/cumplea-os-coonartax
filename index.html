<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COCOLAB COONARTAX 2026</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #1e40af;
            --accent-color: #10b981;
            --light-bg: #f0f9ff;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-secondary: #6b7280;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--light-bg), #e0f2fe);
            color: var(--text-color);
            min-height: 100vh;
            padding: 1rem;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .header { text-align: center; margin-bottom: 1.5rem; }
        
        .current-date {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            background-color: var(--secondary-color);
            color: white;
            border-radius: 9999px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        
        h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem; }
        
        .birthdays-month {
            background: linear-gradient(90deg, #f0fdf4, #ecfdf5);
            border: 1px solid #bbf7d0;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .birthdays-month h3 { color: #065f46; margin-bottom: 0.75rem; }
        
        .birthdays-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
        }
        
        .birthday-item-small {
            display: flex; align-items: center; padding: 0.5rem;
            background-color: white; border-radius: 0.5rem;
        }
        
        .day-circle {
            width: 2rem; height: 2rem; background-color: var(--accent-color);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: white; font-weight: 700; margin-right: 0.75rem;
        }
        
        .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        @media (max-width: 768px) { .filters { grid-template-columns: 1fr; } }
        
        select, input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; }
        
        .birthday-list { display: grid; gap: 1rem; }
        .birthday-item {
            background: linear-gradient(90deg, #eff6ff, #dbeafe);
            border-left: 4px solid var(--primary-color);
            border-radius: 0.5rem; padding: 1rem;
        }
        
        .birthday-content { display: flex; align-items: center; justify-content: space-between; }
        .birthday-info { display: flex; align-items: center; gap: 1rem; }
        .avatar {
            width: 3rem; height: 3rem; background-color: var(--primary-color);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: white; font-weight: 700;
        }
        
        .no-data {
            text-align: center; padding: 2rem; color: var(--text-secondary);
            background: #f9fafb; border-radius: 0.5rem; border: 2px dashed #e5e7eb;
        }
        
        .count { text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-weight: bold; }
        footer { text-align: center; padding: 1rem; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="current-date"><span id="current-date"></span></div>
                <h1>🎂 COCOLAB COONARTAX 2026</h1>
                <p class="subtitle">Listado oficial de cumpleaños 🎂</p>
            </div>
            
            <div id="birthdays-this-month"></div>
            
            <div class="filters">
                <select id="month-filter">
                    <option value="">Todos los meses</option>
                    <option value="enero">Enero</option><option value="febrero">Febrero</option>
                    <option value="marzo">Marzo</option><option value="abril">Abril</option>
                    <option value="mayo">Mayo</option><option value="junio">Junio</option>
                    <option value="julio">Julio</option><option value="agosto">Agosto</option>
                    <option value="septiembre">Septiembre</option><option value="octubre">Octubre</option>
                    <option value="noviembre">Noviembre</option><option value="diciembre">Diciembre</option>
                </select>
                <input type="text" id="search-input" placeholder="Buscar empleado...">
            </div>
            
            <div id="birthday-list" class="birthday-list"></div>
            <div id="count" class="count"></div>
        </div>
        <footer><p>Desarrollado por William Salazar</p></footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Base de datos actualizada con Don Ignacio Gomez
            const birthdays = [
                { date: '17-ene', name: 'Sonia Basante', month: 'enero' },
                { date: '27-ene', name: 'Ramiro Herrera', month: 'enero' },
                { date: '30-ene', name: 'Don Diego Mora', month: 'enero' },
                { date: '31-ene', name: 'Ing. Amanda Villarreal', month: 'enero' },
                { date: '09-feb', name: 'Don Bayardo Eraso', month: 'febrero' },
                { date: '21-feb', name: 'Diana Quintero', month: 'febrero' },
                { date: '03-mar', name: 'Dra. Ayde Ipaz', month: 'marzo' },
                { date: '22-mar', name: 'Wilson Mora', month: 'marzo' },
                { date: '26-mar', name: 'Milena Gonzalez', month: 'marzo' },
                { date: '10-abr', name: 'Ing. Fernando Chamorro', month: 'abril' },
                { date: '15-abr', name: 'Alejandra Florez', month: 'abril' },
                { date: '18-abr', name: 'Don Omar Guerrero', month: 'abril' },
                { date: '07-may', name: 'Elizabeth Rosero', month: 'mayo' },
                { date: '12-may', name: 'Don Wilson Diaz', month: 'mayo' },
                { date: '14-jun', name: 'Diana Caicedo', month: 'junio' },
                { date: '17-jun', name: 'Darcy Valentina', month: 'junio' },
                { date: '03-jul', name: 'Don Jorge Meza', month: 'julio' },
                { date: '25-jul', name: 'Don Victor Orejuela', month: 'julio' },
                { date: '04-ago', name: 'Andrea Cabrera', month: 'agosto' },
                { date: '23-ago', name: 'Leydi Bastidas', month: 'agosto' },
                { date: '24-ago', name: 'Dra. Alexandra', month: 'agosto' },
                { date: '25-ago', name: 'Alemao Rosero', month: 'agosto' },
                { date: '25-ago', name: 'Dr. Fabian Villota', month: 'agosto' },
                { date: '10-sep', name: 'Adali Delgado', month: 'septiembre' },
                { date: '25-sep', name: 'Don Ignacio Gomez', month: 'septiembre' },
                { date: '28-sep', name: 'Andres Morales', month: 'septiembre' },
                { date: '29-sep', name: 'Doña Albita', month: 'septiembre' },
                { date: '12-oct', name: 'Alexander Velasco', month: 'octubre' },
                { date: '02-dic', name: 'Don Jaime Folleco', month: 'diciembre' },
                { date: '04-dic', name: 'Don Luis Maya', month: 'diciembre' },
                { date: '06-dic', name: 'Yelene Ramos', month: 'diciembre' },
                { date: '15-dic', name: 'Don Luis Sanchez', month: 'diciembre' },
                { date: '24-dic', name: 'William Salazar', month: 'diciembre' }
            ];

            const monthMap = { 'ene': 'Enero', 'feb': 'Febrero', 'mar': 'Marzo', 'abr': 'Abril', 'may': 'Mayo', 'jun': 'Junio', 'jul': 'Julio', 'ago': 'Agosto', 'sep': 'Septiembre', 'oct': 'Octubre', 'nov': 'Noviembre', 'dic': 'Diciembre' };
            const monthList = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

            function render() {
                const selectedMonth = document.getElementById('month-filter').value;
                const search = document.getElementById('search-input').value.toLowerCase();
                const filtered = birthdays.filter(b => (!selectedMonth || b.month === selectedMonth) && b.name.toLowerCase().includes(search));
                
                let html = '';
                if (filtered.length === 0) {
                    html = '<div class="no-data">📅 No hay cumpleaños registrados para este mes.</div>';
                } else {
                    filtered.forEach(b => {
                        const [day, mAbbr] = b.date.split('-');
                        html += `<div class="birthday-item"><div class="birthday-content"><div class="birthday-info"><div class="avatar">${b.name.trim()[0]}</div><div><h3>${b.name}</h3><p class="birthday-date">${parseInt(day)} de ${monthMap[mAbbr]}</p></div></div><div class="month-tag">${monthMap[mAbbr]}</div></div></div>`;
                    });
                }
                document.getElementById('birthday-list').innerHTML = html;
                document.getElementById('count').innerHTML = `Personal visualizado: ${filtered.length} de 33 empleados`;
            }

            function init() {
                const now = new Date();
                const currentMonthName = monthList[now.getMonth()];
                document.getElementById('current-date').textContent = `${now.getDate()} de ${currentMonthName.charAt(0).toUpperCase() + currentMonthName.slice(1)} de 2026`;
                document.getElementById('month-filter').value = currentMonthName;
                
                const thisMonth = birthdays.filter(b => b.month === currentMonthName);
                if(thisMonth.length > 0) {
                    let topHtml = `<div class="birthdays-month"><h3>🎉 Cumpleaños de ${currentMonthName.toUpperCase()}</h3><div class="birthdays-grid">`;
                    thisMonth.forEach(b => {
                        topHtml += `<div class="birthday-item-small"><div class="day-circle">${parseInt(b.date.split('-')[0])}</div><span>${b.name}</span></div>`;
                    });
                    document.getElementById('birthdays-this-month').innerHTML = topHtml + '</div></div>';
                }
                render();
            }

            document.getElementById('month-filter').addEventListener('change', render);
            document.getElementById('search-input').addEventListener('input', render);
            init();
        });
    </script>
</body>
</html>
